{% extends 'core/base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-16 font-mono-dev">
    <div class="mb-8">
        <a href="{% url 'blog_list' %}" class="text-neutral-500 hover:text-emerald-400 text-xs">&larr; cd .. /back_to_blogs</a>
    </div>

    <article>
        <div class="text-xs text-emerald-500 mb-3">{{ post.created_at|date:"F d, Y" }}</div>
        <h1 class="text-3xl sm:text-4xl font-bold text-neutral-100 mb-6 leading-tight">{{ post.title }}</h1>
        
        <div class="bg-neutral-950 border border-neutral-800 p-6 sm:p-8 rounded-lg text-neutral-300 space-y-6 leading-relaxed text-sm sm:text-base">
            {{ post.content|safe }}
        </div>
    </article>
</div>
{% endblock %}

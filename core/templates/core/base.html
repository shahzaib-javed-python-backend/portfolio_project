{% load static %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shahzaib Javed | Python Backend Engineer & Django Developer in Pakistan</title>
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="{% static 'core/profile.jpg' %}">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (JetBrains Mono & Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #080808; color: #e5e5e5; }
        .font-mono-dev { font-family: 'JetBrains Mono', monospace; }
        /* Custom scrollbar for terminal feel */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #080808; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #404040; }
    </style>
</head>
<body class="antialiased selection:bg-emerald-500 selection:text-black">

    <!-- Include Navbar Partial -->
    {% include 'core/partials/_navbar.html' %}

    {% block content %}
    {% endblock %}

</body>
</html>
